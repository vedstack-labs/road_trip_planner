<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helpsonroad · AI Trip Planner</title>
  <style>
    :root {
      --bg: #0f1720; --panel: #16212e; --panel2: #1d2b3a; --line: #263647;
      --text: #e7eef6; --muted: #8fa3b8; --accent: #ff7a45; --accent2: #2dd4bf;
      --user: #24405c; --bot: #1d2b3a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 650; }
    header .badge { color: var(--accent); font-weight: 700; }
    header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
    header .status.ok { color: var(--accent2); }
    main { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
    #chat { display: flex; flex-direction: column; min-height: 0; }
    #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 78%; padding: 11px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg.sys { align-self: center; color: var(--muted); font-size: 12px; background: none; }
    .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }
    textarea {
      flex: 1; resize: none; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; font: inherit; height: 46px; max-height: 140px;
    }
    button {
      background: var(--accent); color: #241009; border: 0; border-radius: 10px; padding: 0 20px;
      font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
    aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 16px 8px; }
    #trips { overflow-y: auto; padding: 0 12px 12px; flex: 1; }
    .trip { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .trip .t { font-weight: 650; }
    .trip .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .row { display: flex; gap: 8px; margin: 0 16px 12px; }
    .row button { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--line); font-weight: 600; padding: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 12px; }
    .chip { font-size: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .dots span { animation: b 1.2s infinite; }
    .dots span:nth-child(2){ animation-delay:.2s } .dots span:nth-child(3){ animation-delay:.4s }
    @keyframes b { 0%,60%,100%{opacity:.2} 30%{opacity:1} }
  </style>
</head>
<body>
  <header>
    <h1><span class="badge">Helpsonroad</span> · AI Trip Planner</h1>
    <div class="status" id="status">connecting…</div>
  </header>
  <main>
    <section id="chat">
      <div id="log"></div>
      <div class="chips" id="chips">
        <span class="chip">Plan a weekend road trip from Sydney for two who love nature and coffee</span>
        <span class="chip">A family full-day trip from Melbourne along the Great Ocean Road</span>
        <span class="chip">Plan a scenic day from Kathmandu to Pokhara, Nepal</span>
        <span class="chip">My tyre is flat</span>
      </div>
      <form id="form">
        <textarea id="input" placeholder="Ask the trip planner…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </section>
    <aside>
      <h2>Saved trips</h2>
      <div class="row"><button id="refresh">↻ Refresh</button></div>
      <div id="trips"></div>
    </aside>
  </main>

  <script>
    const API = "/api/v1";
    let token = null;
    let conversationId = null;

    const $ = (id) => document.getElementById(id);
    const log = $("log");

    function add(role, text, who) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      if (who) { const w = document.createElement("div"); w.className = "who"; w.textContent = who; el.appendChild(w); }
      el.appendChild(document.createTextNode(text));
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function init() {
      try {
        const r = await fetch(`${API}/auth/dev-token`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: "web-user", name: "Web Driver", subscription_tier: "premium" }),
        });
        if (!r.ok) throw new Error("token " + r.status);
        token = (await r.json()).access_token;
        $("status").textContent = "● agent ready"; $("status").className = "status ok";
        add("sys", "Authenticated as Web Driver. Ask me to plan a road trip in Australia or Nepal.");
        loadTrips();
      } catch (e) {
        $("status").textContent = "auth failed: " + e.message;
        add("sys", "Could not obtain a dev token. Is the server in development mode?");
      }
    }

    async function send(message) {
      add("user", message, "You");
      const bubble = add("bot", "", "Trip Planner");
      bubble.innerHTML = '<span class="who">Trip Planner</span><span class="dots"><span>●</span><span>●</span><span>●</span></span>';
      const body = document.createElement("span");
      $("send").disabled = true;
      let text = "";
      try {
        const r = await fetch(`${API}/agent/chat/stream`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ message, conversation_id: conversationId }),
        });
        if (!r.ok || !r.body) {
          const d = await r.json().catch(() => ({}));
          throw new Error(d.detail || ("HTTP " + r.status));
        }
        // First token clears the typing dots.
        bubble.innerHTML = '<span class="who">Trip Planner</span>';
        bubble.appendChild(body);
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const frames = buf.split("\n\n");
          buf = frames.pop();
          for (const frame of frames) {
            const line = frame.replace(/^data: /, "").trim();
            if (!line) continue;
            const ev = JSON.parse(line);
            if (ev.type === "delta") {
              text += ev.text;
              body.textContent = text;
              log.scrollTop = log.scrollHeight;
            } else if (ev.type === "done") {
              conversationId = ev.conversation_id;
            } else if (ev.type === "error") {
              throw new Error(ev.message);
            }
          }
        }
        if (!text) body.textContent = "(no response)";
        loadTrips();
      } catch (e) {
        bubble.innerHTML = '<span class="who">Trip Planner</span>';
        bubble.appendChild(document.createTextNode("⚠️ " + e.message));
      } finally {
        $("send").disabled = false; $("input").focus();
      }
    }

    async function loadTrips() {
      if (!token) return;
      try {
        const r = await fetch(`${API}/trips`, { headers: { "Authorization": `Bearer ${token}` } });
        const trips = await r.json();
        const box = $("trips"); box.innerHTML = "";
        if (!trips.length) { box.innerHTML = '<div class="trip m">No saved trips yet.</div>'; return; }
        for (const t of trips) {
          const d = document.createElement("div"); d.className = "trip";
          d.innerHTML = `<div class="t">${t.title}</div><div class="m">${t.origin} → ${t.destination} · ${t.duration.replace("_"," ")} · ${t.stop_count} stops · ${t.region}</div>`;
          box.appendChild(d);
        }
      } catch (_) {}
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = $("input").value.trim(); if (!v) return;
      $("input").value = ""; send(v);
    });
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
    });
    $("chips").addEventListener("click", (e) => {
      if (e.target.classList.contains("chip")) { $("input").value = e.target.textContent; $("input").focus(); }
    });
    $("refresh").addEventListener("click", loadTrips);

    init();
  </script>
</body>
</html>
