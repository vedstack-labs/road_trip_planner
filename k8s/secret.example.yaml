# Example only. Do NOT commit real secrets. Create the real secret with:
#   kubectl create secret generic trip-planner-secrets \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/db \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=GOOGLE_MAPS_API_KEY=AIza...
apiVersion: v1
kind: Secret
metadata:
  name: trip-planner-secrets
  labels:
    app: trip-planner
type: Opaque
stringData:
  JWT_SECRET: "replace-with-strong-random-secret"
  DATABASE_URL: "postgresql+asyncpg://helpsonroad:helpsonroad@postgres:5432/helpsonroad"
  ANTHROPIC_API_KEY: "replace-with-anthropic-key"
  # Optional: enables real Google places/geocoding/routing.
  GOOGLE_MAPS_API_KEY: "replace-with-google-maps-key"
